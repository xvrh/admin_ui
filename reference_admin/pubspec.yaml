name: reference_admin
description: >-
  Potting Shed, the reference admin app built on admin_ui's public barrels
  over an in-memory fake shop. It proves the kit, logs its friction, and its
  flutterware scenarios are both its regression suite and its screenshots.
publish_to: none
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.14.0-0
  # A floor: .fvmrc is the pin. A comparison resolves its base under the
  # branch's SDK, which an exact version here would refuse.
  flutter: '>=3.48.0-0.5.pre'

# The allow-list test/unit/guards_test.dart holds this file to: a new
# dependency is a decision, not a drive-by.
dependencies:
  admin_ui:
    path: ../packages/admin_ui
  clock:
  collection:
  flutter:
    sdk: flutter
  intl:
  material_ui: ^1.4.0

dev_dependencies:
  crypto:
  flutter_lints:
  flutter_test:
    sdk: flutter
  flutterware:
    git:
      url: https://github.com/xvrh/flutterware.git
      ref: e9962fbf68b22beb0d1acd8394268681a51b9c83
  image:
  yaml:

flutter:
  uses-material-design: true
  assets:
    - assets/media/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-ExtraBold.ttf
          weight: 800
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Italic.ttf
          style: italic
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
