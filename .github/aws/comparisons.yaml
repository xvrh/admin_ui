AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Where the Compare workflow keeps the fw compare reports of pull requests: a
  private bucket that CloudFront serves, and a role that only the
  repository's pull request workflows can assume, to write under pr-* and
  nowhere else.

Parameters:
  Repository:
    Type: String
    Description: The GitHub repository whose pull requests publish, owner/name.
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
  SubjectPrefix:
    Type: String
    Default: ''
    Description: >-
      The prefix of the subject in the repository's OIDC tokens, as
      `gh api repos/<owner>/<name>/actions/oidc/customization/sub --jq
      .sub_claim_prefix` prints it; empty for repo:<Repository>. A
      repository with immutable subject claims has its owner's and its own
      IDs in it, repo:<owner>@<id>/<name>@<id>, so a repository recreated
      under the same name cannot assume the role.
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >-
      false when the account already has the token.actions.githubusercontent.com
      identity provider; an account holds one per URL.
  RetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: >-
      Days a report is kept. A closed pull request's report is deleted at once,
      and a new push replaces the last one; this is for the rest.
  AlertEmail:
    Type: String
    Default: ''
    Description: >-
      Where to send a budget alert; empty for no budget. The budget counts the
      account's whole S3 and CloudFront spend, not this stack's alone.
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: The monthly S3 and CloudFront spend the alert is measured against.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, 'true']
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  HasSubjectPrefix: !Not [!Equals [!Ref SubjectPrefix, '']]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # IAM checks GitHub's tokens against its own trusted CAs; these are the
      # published thumbprints, for the API versions that still ask for one.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Private: CloudFront reads it, nobody else. Versioning stays off, so a
  # delete or an expiry frees the space at once.
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-reports
            Status: Enabled
            ExpirationInDays: !Ref RetentionDays
            # Only bites if someone turns versioning on.
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-reports'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Every report lives under its own pr-<number>/<sha>/, so nothing it serves
  # ever changes and the managed caching-optimized policy is safe.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'fw compare reports of ${Repository}'
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          - Id: reports
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: reports
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadsReports
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${Bucket.Arn}/pr-*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: HttpsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt Bucket.Arn
              - !Sub '${Bucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  PublishRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub >-
        Assumed by the Compare workflow of ${Repository} on a pull request, to
        publish and remove its fw compare report.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # A pull_request run of this repository. GitHub gives a fork's
                # pull request no ID token at all.
                token.actions.githubusercontent.com:sub: !If
                  - HasSubjectPrefix
                  - !Sub '${SubjectPrefix}:pull_request'
                  - !Sub 'repo:${Repository}:pull_request'
      Policies:
        - PolicyName: publish-reports
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${Bucket.Arn}/pr-*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: 'pr-*'

  # Monitoring and its notifications are free; it alerts, it does not stop
  # anything.
  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-s3-cloudfront'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        CostFilters:
          Service:
            - Amazon Simple Storage Service
            - Amazon CloudFront
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  Bucket:
    Description: The COMPARISON_BUCKET repository variable.
    Value: !Ref Bucket
  Region:
    Description: The COMPARISON_REGION repository variable.
    Value: !Ref AWS::Region
  RoleArn:
    Description: The COMPARISON_ROLE_ARN repository variable.
    Value: !GetAtt PublishRole.Arn
  Url:
    Description: The COMPARISON_URL repository variable.
    Value: !Sub 'https://${Distribution.DomainName}'
