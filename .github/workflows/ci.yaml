name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, analyze, dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter
      - name: Resolve the workspace
        id: setup
        run: flutter pub get

      - name: Check formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: dart run tool/format.dart --check

      # Runs even when formatting failed, so one run reports both.
      - name: Analyze
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: dart analyze --fatal-infos .

      - name: The kit admits the latest release of every dependency
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: dart run tool/check_constraints.dart

      - name: Known vulnerabilities
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          curl -fsSL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=pubspec.lock

  test:
    name: Tests · ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/admin_ui
          - packages/admin_ui/example
          - reference_admin
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter
      - run: flutter pub get
      - name: flutter test
        working-directory: ${{ matrix.package }}
        run: flutter test

  # The jobs above run the Flutter .fvmrc pins. An app builds the kit with
  # its own, as old as the kit's `environment: flutter:` admits, so this one
  # runs the latest stable patch of that floor (tool/check_floor.dart).
  floor:
    name: Floor · packages/admin_ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the floor
        id: floor
        run: |
          constraint="$(yq -r '.environment.flutter' packages/admin_ui/pubspec.yaml)"
          floor='^>= *([0-9]+)\.([0-9]+)\.'
          if [[ ! "$constraint" =~ $floor ]]; then
            echo "::error file=packages/admin_ui/pubspec.yaml::environment: flutter: is '$constraint', not a '>=x.y.z' floor"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.x" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.floor.outputs.version }}
          channel: stable
          cache: true
      # `dart`, not `dart run`: the workspace does not resolve on the floor.
      - run: dart tool/check_floor.dart
