name: Upgrade

# Once a week, moves .fvmrc to the latest Flutter beta and every pub
# dependency to its latest release (tool/upgrade.dart), and opens one pull
# request with the result, or updates the one already open. CI and Compare run
# on it as on any other pull request: a red check is the upgrade's breakage,
# to fix on its branch, and the next run leaves a branch with someone else's
# commit on it alone.
#
# The pull request is opened and pushed with BOT_PAT, a personal access
# token. One opened with the workflow's own token would start no workflow, so
# its checks would never report and main's ruleset would hold it forever.
# README.md ("Upgrades") makes the token. The Flutter version lives in .fvmrc
# alone, so the token pushes no workflow file and needs no permission to.

on:
  schedule:
    # Mondays, 05:00 UTC.
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: upgrade
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  upgrade:
    name: Flutter and the dependencies to their latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: upgrade
      # The upgrade's commits. A commit by anyone else on the branch is a fix
      # this run must not push over.
      BOT: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: The token is set
        env:
          HAS_TOKEN: ${{ secrets.BOT_PAT != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::error::The BOT_PAT secret opens the pull request; README.md (\"Upgrades\") makes it."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}

      # The index flutter-action installs from. When the beta channel points
      # at a stable release, its version has no `-`, and the Flutter action
      # takes it from stable.
      - name: Move .fvmrc to the latest Flutter beta
        run: |
          version="$(curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
            | jq -r '.current_release.beta as $hash | first(.releases[] | select(.hash == $hash)) | .version')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+\.[0-9]+\.pre)?$ ]]; then
            echo "::error::The release index names no beta: '$version'"
            exit 1
          fi
          sed -i -E "s/(\"flutter\"[[:space:]]*:[[:space:]]*\")[^\"]*/\1$version/" .fvmrc
          echo "The latest beta is $version; .fvmrc pinned $(git show HEAD:.fvmrc | jq -r .flutter)."
      - uses: ./.github/actions/flutter
      - run: flutter pub get
      - name: Upgrade the dependencies
        run: dart run tool/upgrade.dart --summary="$RUNNER_TEMP/summary.md"

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          BASE: ${{ github.event.repository.default_branch }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Flutter and every dependency are at their latest." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            git fetch -q origin "$BRANCH"
            if git log --format=%an "HEAD..FETCH_HEAD" | grep -qvxF "$BOT"; then
              echo "#$pr has someone else's commit on it, so this run leaves it alone." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          if git diff --quiet HEAD -- .fvmrc; then
            title="deps: the latest packages"
          else
            title="deps: Flutter $(jq -r .flutter .fvmrc) and the latest packages"
          fi
          git config user.name "$BOT"
          git config user.email "$BOT_EMAIL"
          git switch -q -c "$BRANCH"
          git add -A
          git commit -q -m "$title"

          # Rebuilt from the base each week; pushed only when it differs, so
          # an unchanged upgrade does not run the checks again.
          if [ -n "$pr" ] && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "#$pr already holds this upgrade." >> "$GITHUB_STEP_SUMMARY"
          else
            git push -q --force origin "$BRANCH"
          fi

          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Written by [a run]($RUN) of \`.github/workflows/upgrade.yaml\`."
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base "$BASE" --head "$BRANCH" --title "$title" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
