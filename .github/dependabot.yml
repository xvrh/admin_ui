# The workflows' actions and the Flutter action's, one pull request a week
# for all of them. Flutter and the pub dependencies are the Upgrade
# workflow's (.github/workflows/upgrade.yaml).
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
