analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - deprecated_member_use_from_same_package
    - prefer_const_constructors
    # public_member_api_docs stays off for now: it reports 2,304 undocumented
    # public members in lib/ (September 2026), which would bury every other
    # finding. Document a member as you touch it.
