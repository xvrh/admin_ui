name: admin_ui_workspace
publish_to: none

environment:
  sdk: ^3.14.0-0

# Root-only tooling (tool/*.dart). The members resolve through
# `resolution: workspace`.
dev_dependencies:
  analyzer: ^14.7.0
  dart_style: ^3.1.9
  flutterware:
    git:
      url: https://github.com/xvrh/flutterware.git
      ref: e9962fbf68b22beb0d1acd8394268681a51b9c83
  http: ^1.6.0
  path: ^1.9.1
  pub_semver: ^2.2.0
  yaml: ^3.1.3

workspace:
  - packages/admin_ui
  - packages/admin_ui/example
  - reference_admin
